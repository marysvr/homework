<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <form>
      <fieldset>
        <div>
          <legend class="title">Ваши личные данные</legend>
          <label>
            <p class="text">Ваше имя</p>
            <input 
            type="text"
            placeholder="имя" 
            name="name" 
            required/>
          </label>
        </div>
        <div>
            <p class="text">Ваш возраст</p>
            <input
              type="number"
              placeholder="возраст"
              name="num"
              value="возраст"
              required
        </div>
        <div>
          <label>
            <p class="text">Ваш номер телефона</p>
            <input
              type="tel"
              placeholder="телефон"
              name="tel"
              required
            />
          </label>
        </div>
        <div>
          <label>
            <p class="text">Ваша почта</p>
            <input
              type="email"
              placeholder="почта"
              name="email"
              required
            />
          </label>
        </div>
        <div>
          <label>
            <p class="text">Сообщение</p>
            <textarea></textarea>
          </label>
        </div>
        <div class="s">
          <label>
            <input type="checkbox" required />
            Я принимаю условия
          </label>
        </div>
        <button class="send">Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
